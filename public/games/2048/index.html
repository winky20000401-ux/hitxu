<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; touch-action: none; }
    .header { display: flex; justify-content: space-between; align-items: center; width: 340px; margin-bottom: 12px; }
    .title { font-size: 32px; font-weight: 800; color: #34d399; }
    .scores { display: flex; gap: 8px; }
    .score-box { background: #1e293b; padding: 6px 12px; border-radius: 6px; text-align: center; }
    .score-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    .score-val { font-size: 16px; font-weight: bold; }
    #board { width: 340px; height: 340px; background: #1e293b; border-radius: 8px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 10px; }
    .cell { background: #334155; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #f8fafc; }
    .v-2 { background: #475569; }
    .v-4 { background: #059669; }
    .v-8 { background: #10b981; }
    .v-16 { background: #0284c7; }
    .v-32 { background: #2563eb; }
    .v-64 { background: #7c3aed; }
    .v-128 { background: #d97706; font-size: 20px; }
    .v-256 { background: #ea580c; font-size: 20px; }
    .v-512 { background: #dc2626; font-size: 20px; }
    .v-1024 { background: #e11d48; font-size: 18px; }
    .v-2048 { background: #10b981; color: #022c22; font-size: 18px; box-shadow: 0 0 10px #10b981; }
    .btn { background: #10b981; color: #0f172a; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box"><div class="score-label">Score</div><div id="score" class="score-val">0</div></div>
      <div class="score-box"><div class="score-label">Best</div><div id="best" class="score-val">0</div></div>
    </div>
  </div>
  <div id="board"></div>
  <button class="btn" onclick="init()">Restart Game</button>
  <script>
    let board = [], score = 0, best = 0;
    function init() {
      board = Array(4).fill(0).map(() => Array(4).fill(0));
      score = 0;
      addRandom(); addRandom();
      render();
    }
    function addRandom() {
      let empty = [];
      for(let r=0; r<4; r++) for(let c=0; c<4; c++) if(board[r][c]===0) empty.push({r,c});
      if(!empty.length) return;
      let {r,c} = empty[Math.floor(Math.random()*empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }
    function render() {
      const container = document.getElementById('board');
      container.innerHTML = '';
      for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
          const val = board[r][c];
          const div = document.createElement('div');
          div.className = 'cell ' + (val > 0 ? 'v-' + val : '');
          div.textContent = val > 0 ? val : '';
          container.appendChild(div);
        }
      }
      document.getElementById('score').textContent = score;
      if(score > best) best = score;
      document.getElementById('best').textContent = best;
    }
    function slide(row) {
      let arr = row.filter(v => v !== 0);
      for(let i=0; i<arr.length-1; i++){
        if(arr[i] === arr[i+1]){
          arr[i] *= 2; score += arr[i]; arr.splice(i+1, 1);
        }
      }
      while(arr.length < 4) arr.push(0);
      return arr;
    }
    function move(dir) {
      let old = JSON.stringify(board);
      if(dir === 'left'){
        board = board.map(row => slide(row));
      } else if(dir === 'right'){
        board = board.map(row => slide(row.reverse()).reverse());
      } else if(dir === 'up'){
        for(let c=0; c<4; c++){
          let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
          col = slide(col);
          for(let r=0; r<4; r++) board[r][c] = col[r];
        }
      } else if(dir === 'down'){
        for(let c=0; c<4; c++){
          let col = [board[3][c], board[2][c], board[1][c], board[0][c]];
          col = slide(col);
          for(let r=0; r<4; r++) board[3-r][c] = col[r];
        }
      }
      if(old !== JSON.stringify(board)){
        addRandom();
        render();
      }
    }
    window.addEventListener('keydown', e => {
      if(e.key === 'ArrowLeft') move('left');
      if(e.key === 'ArrowRight') move('right');
      if(e.key === 'ArrowUp') move('up');
      if(e.key === 'ArrowDown') move('down');
    });
    let touchX=0, touchY=0;
    window.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; });
    window.addEventListener('touchend', e => {
      let dx = e.changedTouches[0].clientX - touchX;
      let dy = e.changedTouches[0].clientY - touchY;
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) move(dx > 0 ? 'right' : 'left');
      else if(Math.abs(dy) > 30) move(dy > 0 ? 'down' : 'up');
    });
    init();
  </script>
</body>
</html>

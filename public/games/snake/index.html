<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    canvas { background: #1e293b; border: 2px solid #334155; border-radius: 8px; }
    .ui { margin-top: 10px; display: flex; gap: 15px; font-weight: bold; font-size: 18px; color: #10b981; }
    .btn { background: #10b981; color: #0f172a; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="ui"><span>Score: <span id="score">0</span></span></div>
  <canvas id="gc" width="340" height="340"></canvas>
  <button class="btn" onclick="reset()">Restart</button>
  <script>
    const canvas = document.getElementById('gc');
    const ctx = canvas.getContext('2d');
    const grid = 17, count = 20;
    let snake = [{x: 10, y: 10}], dir = {x: 0, y: -1}, food = {x: 15, y: 15}, score = 0, gameOver = false;

    function reset() {
      snake = [{x: 10, y: 10}]; dir = {x: 0, y: -1}; score = 0; gameOver = false;
      document.getElementById('score').innerText = score;
      placeFood();
    }
    function placeFood() {
      food = { x: Math.floor(Math.random()*count), y: Math.floor(Math.random()*count) };
    }
    function gameLoop() {
      if(!gameOver) {
        let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if(head.x < 0 || head.x >= count || head.y < 0 || head.y >= count || snake.some(s => s.x === head.x && s.y === head.y)) {
          gameOver = true;
        } else {
          snake.unshift(head);
          if(head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('score').innerText = score;
            placeFood();
          } else {
            snake.pop();
          }
        }
      }
      // Draw
      ctx.fillStyle = '#1e293b'; ctx.fillRect(0,0,340,340);
      ctx.fillStyle = '#ef4444'; ctx.fillRect(food.x*grid, food.y*grid, grid-1, grid-1);
      ctx.fillStyle = '#10b981';
      snake.forEach((s, idx) => {
        ctx.fillStyle = idx === 0 ? '#34d399' : '#10b981';
        ctx.fillRect(s.x*grid, s.y*grid, grid-1, grid-1);
      });
      if(gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)'; ctx.fillRect(0, 0, 340, 340);
        ctx.fillStyle = '#f8fafc'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Game Over!', 170, 170);
      }
    }
    setInterval(gameLoop, 100);
    window.addEventListener('keydown', e => {
      if(e.key === 'ArrowUp' && dir.y !== 1) dir = {x: 0, y: -1};
      if(e.key === 'ArrowDown' && dir.y !== -1) dir = {x: 0, y: 1};
      if(e.key === 'ArrowLeft' && dir.x !== 1) dir = {x: -1, y: 0};
      if(e.key === 'ArrowRight' && dir.x !== -1) dir = {x: 1, y: 0};
    });
    reset();
  </script>
</body>
</html>
